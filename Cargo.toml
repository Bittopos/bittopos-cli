[package]
name = "bitto-cli"
version = "0.1.0"
edition = "2021"
description = "Interfaz de terminal de Bittopos"
license = "MPL-2.0"

[[bin]]
name = "bitto"
path = "src/main.rs"

[dependencies]
bittopos-core = { git = "https://github.com/jasperalsain/bittopos-core", rev = "00f0bfda69a81b8d2cacc3c3ef589f30d964049e" }
clap = { version = "4", features = ["derive"] }
uuid = "1"
