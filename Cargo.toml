[package]
name = "bitto-cli"
version = "0.1.0"
edition = "2021"
description = "Interfaz de terminal de Bittopos"
license = "MPL-2.0"

[[bin]]
name = "bitto"
path = "src/main.rs"

[dependencies]
bittopos-core = { git = "https://github.com/jasperalsain/bittopos-core", rev = "dd96b6d30014d029086256c5070818f4782456e3" }
clap = { version = "4", features = ["derive"] }
uuid = "1"
